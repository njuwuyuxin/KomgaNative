name: komga_api
description: Komga REST 传输层与 URL 构造。DTO 生成在 M1，本包先固化错误模型与传输约定。
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.14.0
resolution: workspace

dependencies:
  # 只用来算证书的 SHA-256 指纹（TOFU 固定叶证书）。选它而不是手写 SHA-256：
  # 密码学原语手写一遍就是给自己挖坑；`crypto` 是 Dart 官方包，且已在依赖树里
  # （此前是 test/coverage 的传递依赖），升级为直接依赖不新增任何包。
  # 理由见 docs/adr/0002-certificate-trust.md。
  crypto: ^3.0.8
  dio: ^5.11.1
  komga_domain:
    path: ../komga_domain

dev_dependencies:
  test: ^1.25.0
