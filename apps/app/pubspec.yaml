name: komga_native
description: KomgaNative — Komga 跨平台客户端（iOS / Android / 墨水屏）。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.11.1
  go_router: ^18.1.4
  komga_api:
    path: ../../packages/komga_api
  komga_design_system:
    path: ../../packages/komga_design_system
  komga_domain:
    path: ../../packages/komga_domain
  komga_platform:
    path: ../../packages/komga_platform
  komga_reader_engine:
    path: ../../packages/komga_reader_engine
  komga_sync_engine:
    path: ../../packages/komga_sync_engine
  drift: ^2.35.4
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  sqlite3: ^3.9.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
  shaders:
    # 翻页卷曲：纸面绕斜折线卷成圆柱。见 docs/reader.md「翻页动画」。
    - shaders/page_curl.frag
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
