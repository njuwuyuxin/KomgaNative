name: yomu
description: Yomu — 跨平台漫画阅读器（支持本地导入与 Komga，iOS / Android / 墨水屏）。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.11.1
  go_router: ^18.1.4
  komga_api:
    path: ../../packages/komga_api
  yomu_design_system:
    path: ../../packages/yomu_design_system
  yomu_domain:
    path: ../../packages/yomu_domain
  yomu_local_archive:
    path: ../../packages/yomu_local_archive
  yomu_platform:
    path: ../../packages/yomu_platform
  yomu_reader:
    path: ../../packages/yomu_reader
  yomu_sync:
    path: ../../packages/yomu_sync
  drift: ^2.35.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  sqlite3: ^3.9.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
  shaders:
    # 翻页卷曲：圆柱卷页模型，逆映射逐像素合成。见 docs/reader.md「翻页动画」。
    - shaders/page_curl.frag
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
