name: yomu_workspace
publish_to: none

environment:
  sdk: ^3.14.0

# Dart pub workspace：所有成员共享一份 lockfile，包边界 = Agent 任务边界。
workspace:
  - apps/app
  - packages/yomu_domain
  - packages/yomu_reader
  - packages/yomu_sync
  - packages/komga_api
  - packages/yomu_design_system
  - packages/yomu_platform
