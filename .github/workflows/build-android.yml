name: Android

# 只在 main 分支和手动触发时构建，避免每次 PR 都拉 Gradle 依赖。
# 产物是未签名（debug 签名）的 release APK，用于验证整条 Android 构建链路；
# 正式签名要等 M6 配好 keystore + secrets。
on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Pub get (workspace)
        working-directory: apps/app
        run: flutter pub get

      - name: Cache Drift codegen
        id: drift-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/app/lib/src/data/progress/progress_database.g.dart
            apps/app/lib/src/data/cache/http_cache_database.g.dart
          key: drift-v1-${{ runner.os }}-${{ hashFiles('apps/app/lib/src/data/local/local_tables.dart', 'apps/app/lib/src/data/progress/progress_database.dart', 'apps/app/lib/src/data/progress/progress_user_dao.dart', 'apps/app/lib/src/data/progress/user_tables.dart', 'apps/app/lib/src/data/cache/http_cache_database.dart', 'apps/app/lib/src/data/cache/http_cache_downloads_dao.dart', 'apps/app/lib/src/data/cache/http_cache_tables.dart', 'pubspec.lock') }}

      - name: Refresh cached Drift timestamps
        if: steps.drift-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch apps/app/lib/src/data/progress/progress_database.g.dart apps/app/lib/src/data/cache/http_cache_database.g.dart

      - name: Generate code (drift + l10n)
        # 生成物（*.g.dart / app_localizations*.dart）不入库，CI 是全新 clone：
        # 少了它们 AOT 编译会以 "The getter 'cachedResponses' isn't defined" 失败。
        # 与门禁共用同一条命令，避免本地/CI 双轨。
        run: dart run tool/ci.dart codegen

      - name: Build APK
        working-directory: apps/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: komga-native-apk
          path: apps/app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
