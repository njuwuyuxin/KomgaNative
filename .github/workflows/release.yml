name: Release

# 推送 v* 标签时自动构建正式签名的 Android APK 并发布到 GitHub Releases：
# - 稳定版标签（如 v0.1.0、v1.0.0）自动设为 Latest release；
# - 预发布标签（含 "-"，如 v0.2.0-rc.1、v0.2.0-beta.1）自动标记为 Pre-release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    name: Release Gate (format + analyze + layers + tests + goldens)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Pub get (workspace)
        working-directory: apps/app
        run: flutter pub get

      - name: Gate
        run: dart run tool/ci.dart check

  release-android:
    name: Build & Publish Android Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches pubspec.yaml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PUBSPEC_RAW="$(grep -E '^version:' apps/app/pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')"
          PUBSPEC_VERSION="${PUBSPEC_RAW%%+*}"
          echo "Tag version:     ${TAG_VERSION}"
          echo "pubspec version: ${PUBSPEC_VERSION} (raw: ${PUBSPEC_RAW})"
          if [ "${TAG_VERSION}" != "${PUBSPEC_VERSION}" ]; then
            echo "::error::Tag ${TAG} 与 apps/app/pubspec.yaml 的 version (${PUBSPEC_RAW}) 不一致。请先更新 pubspec.yaml 再打 tag。"
            exit 1
          fi

      - name: Verify signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ANDROID_KEYSTORE_BASE64}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${ANDROID_KEY_PASSWORD}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 Android 发布签名 Secrets：${missing[*]}。请在仓库 Settings → Secrets and variables → Actions 中配置。"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Pub get (workspace)
        working-directory: apps/app
        run: flutter pub get

      - name: Generate code (drift + l10n)
        run: dart run tool/ci.dart codegen

      - name: Configure Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          android_dir = Path("apps/app/android")
          keystore_path = android_dir / "release-keystore.jks"
          raw = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          keystore_path.write_bytes(base64.b64decode(raw))

          def escape_prop(value: str) -> str:
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
              )

          props = "\n".join([
              "storeFile=release-keystore.jks",
              f"storePassword={escape_prop(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyAlias={escape_prop(os.environ['ANDROID_KEY_ALIAS'])}",
              f"keyPassword={escape_prop(os.environ['ANDROID_KEY_PASSWORD'])}",
          ]) + "\n"
          (android_dir / "key.properties").write_text(props, encoding="utf-8")
          PY

      - name: Build split-per-ABI release APKs
        working-directory: apps/app
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        working-directory: apps/app
        run: flutter build apk --release

      - name: Verify APK signing & prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK_DIR="apps/app/build/app/outputs/flutter-apk"
          OUT_DIR="release-assets"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          cp "${APK_DIR}/app-arm64-v8a-release.apk"   "${OUT_DIR}/Yomu-${TAG}-android-arm64-v8a.apk"
          cp "${APK_DIR}/app-armeabi-v7a-release.apk" "${OUT_DIR}/Yomu-${TAG}-android-armeabi-v7a.apk"
          cp "${APK_DIR}/app-x86_64-release.apk"      "${OUT_DIR}/Yomu-${TAG}-android-x86_64.apk"
          cp "${APK_DIR}/app-release.apk"             "${OUT_DIR}/Yomu-${TAG}-android-universal.apk"

          # 确认产物签名有效、包含 v1/v2/v3 完整签名块且使用正式证书，绝不误发 Android Debug 签名包
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          for apk in "${OUT_DIR}"/*.apk; do
            if [ -n "${APKSIGNER}" ]; then
              # minSdk=24 时 apksigner 默认跳过 v1 校验；传 --min-sdk-version 21 以显式验全 v1+v2+v3
              cert_info="$("${APKSIGNER}" verify -v --min-sdk-version 21 --print-certs "${apk}")"
            else
              cert_info="$(keytool -printcert -jarfile "${apk}")"
            fi
            echo "=== ${apk} ==="
            echo "${cert_info}"
            if echo "${cert_info}" | grep -q "CN=Android Debug"; then
              echo "::error::${apk} 仍使用了 Android Debug 签名，终止发布！"
              exit 1
            fi
            if [ -n "${APKSIGNER}" ]; then
              for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" "v3 scheme (APK Signature Scheme v3): true"; do
                if ! echo "${cert_info}" | grep -qF "${scheme}"; then
                  echo "::error::${apk} 缺少预期签名方案（${scheme}），终止发布！"
                  exit 1
                fi
              done
            fi
          done

          (
            cd "${OUT_DIR}"
            sha256sum *.apk > SHA256SUMS.txt
          )
          ls -lh "${OUT_DIR}"
          cat "${OUT_DIR}/SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          cat <<'EOF' > release-body.md
          ### Android 安装包选择

          - **arm64-v8a**（推荐）：绝大多数现代 Android 手机、平板与墨水屏设备。
          - **armeabi-v7a**：较旧的 32 位 ARM 设备 / 老款墨水屏。
          - **x86_64**：x86 平板或模拟器。
          - **universal**：通用安装包，不确定设备架构时直接下载此版本。
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            EXTRA_ARGS=(--latest)
            if [[ "${TAG}" == *-* ]]; then
              EXTRA_ARGS=(--prerelease)
            fi
            gh release create "${TAG}" release-assets/* \
              --title "Yomu ${TAG}" \
              --notes-file release-body.md \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi

      - name: Cleanup keystore files
        if: always()
        shell: bash
        run: |
          rm -f apps/app/android/release-keystore.jks apps/app/android/key.properties release-body.md
