name: iOS

# 仓库为 public → 标准 runner 全部免费，所以 iOS 也跟 push/PR 跑
# （私有仓库时 macOS 按 10× 计费，应把 pull_request 触发去掉，只留手动/tag）
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Pub get (workspace)
        working-directory: apps/app
        run: flutter pub get

      - name: Generate code (drift + l10n)
        # 同 build-android.yml：生成物不入库，全新 clone 必须先跑 codegen，
        # 否则编译期找不到 drift 的 part 文件。
        run: dart run tool/ci.dart codegen

      - name: Build iOS
        working-directory: apps/app
        run: flutter build ios --release --no-codesign

      - name: Package .app
        # 未签名的 .app 目录无法直接作为 artifact，先打成 zip。
        run: |
          cd apps/app/build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.app.zip

      - name: Upload .app
        uses: actions/upload-artifact@v7
        with:
          name: komga-native-ios-unsigned
          path: apps/app/build/ios/iphoneos/Runner.app.zip
          retention-days: 14
